                                                <span className="font-medium text-stone-800">{item.item}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-bold text-emerald-800">${item.amount.toFixed(2)} AUD</span>
                                                    <button 
                                                        onClick={() => deleteExpense(item.id)}
                                                        className="text-stone-400 hover:text-red-500 transition-colors"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-400 text-xs text-center py-6 px-4 mt-8 border-t border-stone-800">
                        <div className="max-w-5xl mx-auto space-y-2">
                            <p>🇦🇺 祝 2027 墨爾本 6 日親子自駕之旅平安順心、收穫滿滿美好回憶！</p>
                            <p className="text-stone-600">Melbourne Self-Drive Travel Handbook • 2027/06/27 – 2027/07/02</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
