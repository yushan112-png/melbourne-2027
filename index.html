                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* Trip Notes */}
                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-200 space-y-4">
                                    <h2 className="text-lg font-bold text-stone-800 flex items-center gap-2">
                                        <i data-lucide="notebook" className="text-amber-600 w-5 h-5"></i> 行程隨手筆記 / 備忘錄
                                    </h2>
                                    <p className="text-xs text-stone-500">此筆記會自動儲存於您的瀏覽器中。</p>
                                    <textarea
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        rows={12}
                                        className="w-full p-4 rounded-2xl border border-stone-300 focus:ring-2 focus:ring-amber-500 focus:outline-none text-xs text-stone-800 leading-relaxed custom-scrollbar"
                                        placeholder="輸入購物清單、餐廳名稱、停車位編號等..."
                                    ></textarea>
                                </div>

                                {/* Expense Scratchpad with Dual Currency (AUD + TWD) */}
                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-stone-200 space-y-4">
                                    <div className="flex items-start justify-between flex-wrap gap-2">
                                        <div>
                                            <h2 className="text-lg font-bold text-stone-800 flex items-center gap-2">
                                                <i data-lucide="calculator" className="text-emerald-600 w-5 h-5"></i> 旅程預算與消費記帳
                                            </h2>
                                            {/* Exchange Rate Input Bar */}
                                            <div className="mt-2 inline-flex items-center gap-1.5 bg-stone-100 px-3 py-1.5 rounded-xl border border-stone-200 text-xs text-stone-700">
                                                <span className="font-medium">💱 參考匯率：1 AUD =</span>
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    min="0"
                                                    value={exchangeRate}
                                                    onChange={(e) => setExchangeRate(e.target.value)}
                                                    className="w-16 px-1.5 py-0.5 bg-white border border-stone-300 rounded-md text-center font-bold text-amber-800 focus:ring-2 focus:ring-amber-500 focus:outline-none"
                                                />
                                                <span className="font-medium">TWD</span>
                                            </div>
                                        </div>

                                        {/* Dual Currency Total Badge */}
                                        <div className="text-right bg-emerald-50 px-3.5 py-2 rounded-2xl border border-emerald-200">
                                            <div className="text-sm font-extrabold text-emerald-800">
                                                總計: ${totalExpenses.toFixed(2)} AUD
                                            </div>
                                            <div className="text-xs font-bold text-amber-800 mt-0.5">
                                                ≈ NT$ {totalTWD.toLocaleString()}
                                            </div>
                                        </div>
                                    </div>

                                    {/* TRS Reminder Box */}
                                    <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200 text-[11px] text-amber-900 leading-relaxed">
                                        💡 <strong>TRS 退稅提示</strong>：在同一商家 (如 Chemist Warehouse 或 DFO) 單筆消費滿 <strong>AU$300</strong> 以上，離境時出示發票可辦理 10% 退稅！
                                    </div>

                                    {/* Add Expense Form */}
                                    <form onSubmit={addExpense} className="flex flex-col gap-2">
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                placeholder="消費項目 (如: 魚油採買)"
                                                value={expItem}
                                                onChange={(e) => setExpItem(e.target.value)}
                                                className="flex-1 p-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                            />
                                            <input
                                                type="number"
                                                step="0.01"
                                                placeholder="金額 AUD"
                                                value={expAmount}
                                                onChange={(e) => setExpAmount(e.target.value)}
                                                className="w-28 p-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                            />
                                        </div>
                                        {expAmount && !isNaN(parseFloat(expAmount)) && parseFloat(expAmount) > 0 && (
                                            <div className="text-[11px] text-right text-stone-500 px-1">
                                                即時換算：約 <span className="font-bold text-amber-700">NT$ {Math.round(parseFloat(expAmount) * validRate).toLocaleString()}</span>
                                            </div>
                                        )}
                                        <button 
                                            type="submit"
                                            className="w-full bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-800 transition-colors shadow-sm"
                                        >
                                            ＋ 新增消費項目
                                        </button>
                                    </form>

                                    {/* Expense List */}
                                    <div className="space-y-2 max-h-64 overflow-y-auto custom-scrollbar pt-2">
                                        {expenseList.map(item => {
                                            const itemTWD = Math.round(item.amount * validRate);
                                            return (
                                                <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-stone-50 border border-stone-200 text-xs">
                                                    <div className="pr-2">
                                                        <span className="font-bold text-stone-800">{item.item}</span>
                                                        {item.amount >= 300 && (
                                                            <span className="ml-2 inline-block text-[10px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded">可辦 TRS 退稅</span>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-3 shrink-0">
                                                        <div className="text-right">
                                                            <div className="font-extrabold text-emerald-800">${item.amount.toFixed(2)} AUD</div>
                                                            <div className="text-[11px] font-medium text-stone-500">≈ NT$ {itemTWD.toLocaleString()}</div>
                                                        </div>
                                                        <button 
                                                            onClick={() => deleteExpense(item.id)}
                                                            className="text-stone-400 hover:text-red-500 transition-colors p-1"
                                                            title="刪除項目"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-400 text-xs text-center py-6 px-4 mt-8 border-t border-stone-800">
                        <div className="max-w-5xl mx-auto space-y-2">
                            <p>🇦🇺 祝 2027 墨爾本 9 天 8 夜親子賞雪與自然自駕之旅平安順利、收穫滿滿美好回憶！</p>
                            <p className="text-stone-600">Melbourne 9D8N Family Winter Travel Handbook • 2027/06/26 – 2027/07/04</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
